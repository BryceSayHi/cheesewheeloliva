<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frank</title>
<style>
@font-face{font-family:"CustomFont";src:url(font/terminal-font.ttf) format("truetype");font-display:swap}
:root{--fg:#fff;--bg:#000;--accent:#f33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);font-family:"CustomFont","Trebuchet MS",sans-serif;color:var(--fg)}
#stage{position:relative;height:100%;max-width:820px;margin:0 auto;overflow:hidden;background:var(--bg);user-select:none;touch-action:none}
#sprite{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);height:min(50vh,420px);image-rendering:pixelated}
#sprite.bt{bottom:40%}
#sprite.shake{animation:sh .3s}
#sprite.spin{animation:spn 1.6s linear forwards}
#sprite.big{transform:translateX(-50%) scale(1.7)}
@keyframes sh{25%{transform:translateX(-56%) rotate(-5deg)}75%{transform:translateX(-44%) rotate(5deg)}}
@keyframes spn{from{transform:translateX(-50%) rotate(0) scale(1)}to{transform:translateX(-50%) rotate(720deg) scale(.8)}}
#bubble{display:none;position:absolute;z-index:4;top:8px;left:50%;transform:translateX(-50%);max-width:88%;box-sizing:border-box;background:var(--bg);border:12px solid transparent;border-image:url(image/text_box.avif) 6 stretch;image-rendering:pixelated;padding:2px 8px;font-family:"CustomFont","Courier New",monospace;font-size:.95rem;text-align:center;line-height:1.3}
#choices{z-index:5;position:absolute;left:0;right:0;top:8%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px}
#choices button{width:min(480px,100%);font:inherit;font-size:1rem;padding:8px 10px;border:18px solid transparent;border-image:url(image/choice_box.avif) 6 stretch;image-rendering:pixelated;background:var(--bg);color:var(--fg);cursor:pointer}
#choices button:hover{background:#222}
#bm{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
#bm button.img{background:none;border:none;padding:0;cursor:pointer}
#bm button.img img{width:min(200px,38vw);height:auto;image-rendering:pixelated;display:block}
#bm button.img:hover img{filter:sepia(1) saturate(8) hue-rotate(5deg)}
#bm button.txt{font:inherit;font-size:1rem;padding:8px 10px;border:18px solid transparent;border-image:url(image/choice_box.avif) 6 stretch;image-rendering:pixelated;background:var(--bg);color:var(--fg);cursor:pointer}
#bm button.txt:hover{background:#222}
#bm button:disabled{opacity:.4;cursor:default}
#choices button.evil{border-image-source:url(image/choice_box2.avif);color:var(--accent)}
#dlg{z-index:5;position:absolute;left:10px;right:10px;bottom:10px;min-height:130px;background:var(--bg);border:18px solid transparent;border-image:url(image/text_box.avif) 6 stretch;image-rendering:pixelated;padding:14px 6px 6px;box-sizing:border-box;cursor:pointer}
#name{position:absolute;top:-34px;left:-4px;background:var(--fg);color:var(--bg);padding:3px 14px;font-weight:bold;min-width:40px;text-align:center}
#txt{margin:0;font-size:1.1rem;line-height:1.45;white-space:pre-line;font-family:"CustomFont","Courier New",monospace}
#more{position:absolute;right:2px;bottom:0;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#battle{display:none;position:absolute;left:0;right:0;bottom:0;height:40%;background:var(--bg);text-align:center}
#cv{width:min(100%,66vh);height:auto;touch-action:none}
#score{display:none;position:absolute;z-index:3;top:6px;left:0;right:0;text-align:center;color:#ff0;font-size:1.1rem;letter-spacing:1px;pointer-events:none;font-family:"CustomFont","Courier New",monospace}
#score.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35);color:#fff}}
#stage.endless #bubble{top:34px}
#blackout{position:absolute;z-index:4;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#blackout.on{opacity:1;pointer-events:auto}
#menu{position:absolute;z-index:6;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:min(16vh,120px) 16px 0;box-sizing:border-box;background:#000;image-rendering:pixelated}
#menu h1{margin:0 0 min(9vh,64px);font:inherit;font-size:clamp(2.4rem,11vw,4rem);font-weight:normal;line-height:1.1;text-align:center;padding:6px 32px;border:18px solid transparent;border-image:url(image/text_box.avif) 6 stretch;background:var(--bg)}
#menu button{display:block;font:inherit;font-size:1.15rem;padding:4px 14px;margin-bottom:14px;border:12px solid transparent;border-image:url(image/choice_box.avif) 6 stretch;image-rendering:pixelated;background:var(--bg);color:var(--fg);cursor:pointer}
#menu button:hover,#menu button:focus-visible{background:#222;outline:none}
#mm,#warn{display:flex;flex-direction:column;align-items:center;max-width:100%}
#warn{display:none}
#warn p{margin:0 0 24px;box-sizing:border-box;max-width:min(520px,100%);text-align:center;font-size:1.15rem;line-height:1.4;padding:10px 14px;border:18px solid transparent;border-image:url(image/text_box.avif) 6 stretch;background:var(--bg)}
#warn button{max-width:100%}
#menu button.evil{border-image-source:url(image/choice_box2.avif);color:var(--accent)}
#opt{display:none;flex-direction:column;align-items:center;width:min(420px,100%)}
#opt h2{margin:0 0 min(5vh,32px);font:inherit;font-size:clamp(1.6rem,7vw,2.2rem);font-weight:normal}
.orow{width:100%;margin-bottom:min(5vh,30px);text-align:center}
.olab{font-size:1.1rem;margin-bottom:12px}
.sl{position:relative;width:min(160px,36vw);margin:0 auto;cursor:pointer;touch-action:none;user-select:none}
.sl img.tr{display:block;width:100%;height:auto;image-rendering:pixelated;pointer-events:none}
.sl img.kn{position:absolute;top:50%;width:17px;height:auto;image-rendering:pixelated;transform:translate(-50%,-50%);pointer-events:none}
#load{font-size:.9rem;min-height:1.2em;color:#aaa}
#menu button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="stage">
<img id="sprite" alt="Frank" src="">
<div id="bubble"></div>
<div id="choices"></div>
<div id="dlg"><div id="name"></div><p id="txt"></p><div id="bm"></div><span id="more">▼</span></div>
<div id="battle"><canvas id="cv" width="360" height="215"></canvas></div>
<div id="score"></div>
<div id="blackout"></div>
<div id="menu"><div id="mm"><h1>Olivarune</h1><button id="playBtn">PLAY</button><button id="hdBtn">INFINITE HYPERDEATH</button><button id="optBtn">OPTIONS</button><div id="load"></div></div><div id="opt"><h2>OPTIONS</h2><div id="sliders"></div><button id="optBack">BACK</button></div><div id="warn"><p>hey! you might wanna play the story before playing INFINITE HYPERDEATH</p><button id="warnOk">okay</button><button id="warnNo" class="evil">no I'm a yucky hobo and hate fun</button></div></div>
</div>
<script>
const IMG={normal:'image/frank_normal.avif',talk1:'image/frank_talk1.avif',talk2:'image/frank_talk2.avif',taunt:'image/frank_taunt.avif',ref:'image/frank_sans.avif'};
const $=id=>document.getElementById(id);
const BOOM='gif/explode.gif';
let HEART,ROCK;
const BTN={fight:'image/fight.avif',heal:'image/heal.avif'};
const VOL_KEY='frank_vol';const VOL={music:1,speak:1};
try{const v=JSON.parse(localStorage.getItem(VOL_KEY)||'{}');if(typeof v.music==='number')VOL.music=Math.max(0,Math.min(1,v.music));if(typeof v.speak==='number')VOL.speak=Math.max(0,Math.min(1,v.speak));}catch(e){}
function saveVol(){try{localStorage.setItem(VOL_KEY,JSON.stringify(VOL));}catch(e){}}
const TALK_MS=30,HIT_R=11;
const KEEP=[];let preLeft=0,preTotal=0;
function preUI(){const e=$('load');if(e)e.textContent=preLeft>0?'loading '+(preTotal-preLeft)+'/'+preTotal+'...':'';$('playBtn').disabled=$('hdBtn').disabled=preLeft>0;}
function track(p){preTotal++;preLeft++;let d=0;const done=()=>{if(d)return;d=1;preLeft--;preUI();};p.then(done,done);setTimeout(done,8000);}
function pimg(src){const i=new Image();KEEP.push(i);track(new Promise(r=>{i.onload=r;i.onerror=r;}));i.src=src;return i;}
track(document.fonts.load('16px CustomFont'));
HEART=pimg('image/heart.avif');ROCK=pimg('image/rock.avif');
[...Object.values(IMG),...Object.values(BTN),'image/text_box.avif','image/choice_box.avif','image/choice_box2.avif','image/slider.avif',BOOM].forEach(u=>pimg(u));
preUI();
const POOL=[];let pi=0,unlocked=false;
for(let k=0;k<4;k++){const a=new Audio('audio/talk.aac');a.preload='auto';POOL.push(a);}
function unlock(){unlocked=true;}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function blip(ch){if(!unlocked||!ch||/\s/.test(ch)||VOL.speak<=0)return;const a=POOL[pi++%POOL.length];try{a.volume=.5*VOL.speak;a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
// ---- MUSIC ----
const mkTrack=(srcs,loop)=>{const a=new Audio();a.preload='auto';a.loop=loop;a.volume=.5;srcs.forEach(u=>{const e=document.createElement('source');e.src=u;a.appendChild(e);});return a;};
const MUS={menu:mkTrack(['audio/anza.aac'],true),boss:mkTrack(['audio/BIG_SHOT.aac','audio/BIGSHOT.aac'],false),loop:mkTrack(['audio/BIG_SHOT_loop.aac','audio/BIGSHOT_loop.aac'],true)};
function applyVol(){for(const k in MUS)MUS[k].volume=.5*VOL.music;}applyVol();
let wantMus='menu',bossDone=false;
function applyMusic(){const act=wantMus==='menu'?'menu':wantMus==='boss'?(bossDone?'loop':'boss'):null;
 for(const k in MUS){const a=MUS[k];if(k===act){if(a.paused)a.play().catch(()=>{});}else if(!a.paused||a.currentTime>0){a.pause();a.currentTime=0;}}}
function setMusic(k){if(k==='boss'&&wantMus!=='boss')bossDone=false;wantMus=k;applyMusic();}
function bossToLoop(){if(wantMus==='boss'&&!bossDone){bossDone=true;applyMusic();}}
MUS.boss.addEventListener('ended',bossToLoop);
setInterval(()=>{const a=MUS.boss;if(wantMus==='boss'&&!bossDone&&!a.paused&&isFinite(a.duration)&&a.duration>0&&a.currentTime>=a.duration-.06)bossToLoop();},25);
['pointerdown','pointerup','keydown','touchend','click'].forEach(ev=>addEventListener(ev,e=>{if(e.target&&e.target.closest&&e.target.closest('#menu button'))return;applyMusic();},{passive:true}));
const SEQ=['normal','talk1','talk2','talk1'];
let cont=null,asked,asked2,typing=false,fin=null,ty=null,tk=null,endless=false,score=0,introTok=0;
function setSprite(k){$('sprite').src=IMG[k];}
function clr(){clearInterval(ty);clearInterval(tk);typing=false;}
function say(who,text,next,sd,done){sd=sd||TALK_MS;clr();$('bm').innerHTML='';$('txt').style.display='';$('dlg').style.display='block';$('name').textContent=who;$('name').style.display=who?'block':'none';$('txt').textContent='';$('choices').innerHTML='';$('more').style.display='none';cont=null;
 let i=0,t0=performance.now();typing=true;
 fin=()=>{clr();$('txt').textContent=text;if(who==='Frank')setSprite('normal');$('more').style.display=next?'block':'none';cont=next||null;if(done)done();};
 ty=setInterval(()=>{const n=Math.min(text.length,Math.floor((performance.now()-t0)/sd));if(n<=i)return;i=n;$('txt').textContent=text.slice(0,i);blip(text[i-1]);if(who==='Frank')setSprite(SEQ[Math.floor(i/4)%4]);if(i>=text.length)fin();},10);}
function choose(text,opts){clr();$('bm').innerHTML='';$('txt').style.display='';$('dlg').style.display='block';$('name').textContent='Al';$('name').style.display='block';$('txt').textContent=text;$('more').style.display='none';cont=null;const c=$('choices');c.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o[0];if(o[2])b.className='evil';b.onclick=e=>{e.stopPropagation();o[1]();};c.appendChild(b);});}
$('dlg').onclick=()=>{if(typing)fin();else if(cont)cont();};
const HIST_INTRO=`In late July 1919, Chicago broke into one of the worst episodes of racial violence in American history. The riot began on July 27 and continued in waves until early August, leaving 38 people dead, of which 23 were black and 15 were white, 537 injured, and roughly a thousand, mostly Black, residents homeless. It was the deadliest outbreak of the "Red Summer" of 1919, when violence against black people flared in dozens of cities. The immediate spark was small, but the conditions that made it so terrible were building for a long time before that.`;
const HIST_Q=[
["What led to the Chicago Riots?",[
`Well the direct trigger was the death of Eugene Williams, a 17-year-old Black teenager whose raft drifted across the "line" that divided the 29th Street beach. A white man on the shore threw rocks at him, preventing him from coming to shore and causing Williams to drown. When a white police officer refused to arrest the man responsible and instead chose to arrest a black man who had thrown a punch at the killer, which turned the crowd's anger into violence.`,
`There was also the Great Migration that brought tens of thousands of Black Southerners to Chicago in search of industrial work and an escape from the Jim Crow laws, and the city's Black population roughly doubled between 1910 and 1920. This growth collided with a rigid housing market. Restrictive covenants, real estate practices, and social pressure confined Black residents to the narrow, overcrowded "Black Belt" on the South Side. As Black families pushed outward in search of decent housing, white neighbors and "improvement associations" resisted, and dozens of Black homes were firebombed in the years before the riot.`,
`Labor competition also added to the tension. Many Black workers had been hired into the stockyards and packing plants during World War I, sometimes as strikebreakers, and most white-dominated unions excluded them or treated them with hostility. When soldiers returned home in 1919 and the wartime economy shrank, white workers feared for their jobs, while Black workers, including veterans who had fought for democracy abroad, were less willing to accept second-class treatment. Institutions only made matters worse. The police were widely seen as biased, and the press often dramatized racial incidents. White neighborhood athletic clubs, which functioned partly as street gangs, organized attacks on Black residents, while politics fueled ethnic and racial rivalries.`]],
["What happened after the Riots?",[
`The immediate effects were seen in lives and property. Six thousand state militia troops eventually helped restore order, and a heavy rainfall also helped end the violence. Black residents bore the heaviest losses, including most of the homes destroyed. Criminal prosecutions afterward were uneven, and few white rioters faced serious consequences.`]],
["What did the gov change after the fact?",[
`Governor Frank Lowden appointed the Chicago Commission on Race Relations, which produced the 1922 report The Negro in Chicago. It was a landmark study that documented housing discrimination, employment barriers, and police bias, and it recommended reforms. Yet its recommendations were largely ignored. Restrictive covenants spread, and residential segregation hardened over the following decades, leaving the Black Belt more tightly bound than before. The riots also reshaped Black political and cultural life. Anti-lynching and civil rights organizing gained momentum, and a stronger belief of self-defense took hold, captured in works like Claude McKay's poem "If We Must Die." Within Chicago, Black political organization deepened, eventually contributing to the rise of figures such as Oscar De Priest, who in 1928 became the first Black congressman elected from the North. Distrust between Black workers and organized labor persisted, and many Black workers concluded that employers were a more reliable, if self-interested, ally than white-led unions.`]]];
const HIST_SUM=`So you see, Al. The 1919 riots were not a spontaneous outburst but the product of migration, housing segregation, labor competition, and institutional bias reaching a breaking point. Its effects were just as lasting, the failure to act on its lessons entrenched segregation in Chicago, while the anger and organizing it inspired helped lay groundwork for the civil rights movement.`;
const AL_TOPIC="Well, now I definitely know a lot more about the Chicago Riots, wanna talk about...";
// split long passages into click-through pages so the dialog box never overflows
function pages(t,max){max=max||260;const ss=t.match(/[^.!?]*[.!?]+["']?(?:\s+|$)|[^.!?]+$/g)||[t];const out=[];let c='';ss.forEach(x=>{x=x.trim();if(!x)return;if(c&&(c+' '+x).length>max){out.push(c);c=x;}else c=c?c+' '+x:x;});if(c)out.push(c);return out;}
function chain(who,paras,next,sd){const p=[].concat(...paras.map(x=>pages(x)));(function go(i){say(who,p[i],i<p.length-1?()=>go(i+1):next,sd);})(0);}
function hub(){const o=HIST_Q.map((q,i)=>[(asked.has(i)?'✔ ':'')+q[0],()=>ask(i)]);choose('(What should I ask him?)',o);}
function ask(i){asked.add(i);chain('Frank',HIST_Q[i][1],afterAsk,22);}
function afterAsk(){if(asked.size>=HIST_Q.length)choose('(You have heard all three. What now?)',[['Reread the 3',hub],['Continue',summary]]);else hub();}
function summary(){chain('Frank',[HIST_SUM],()=>say('Al',AL_TOPIC,null,30,()=>topics(true)),22);}
function topics(first){
 const o=[['Polka',()=>{asked2.add(0);say('Frank','Polka? I HATE polka...',()=>topics());}],['Accordions',()=>{asked2.add(1);say('Frank','Accordions? That thing used to make the WORST music ever?',()=>topics());}]];
 o.forEach((x,i)=>{if(asked2.has(i))x[0]='✔ '+x[0];});
 if(asked2.size>=2)o.push(['There will be no polka disrespect in my presence, DESTROY HIM!',fight,true]);
 choose(first?AL_TOPIC:'(What do you say?)',o);}
function fight(){const tok=++introTok;setMusic('boss');
 // [text, ms]  -- slots add up to 13000ms of Frank talking, then the arena shows for 4s before the first attack
 const L=[["You dare?! Fine. Dodge THIS!",2500],["Do you know how long I have waited\nto ruin someone's accordion solo?",3600],["Years, Al. YEARS. Of elevator jazz.\nOf cloudy skies. Of polka-free roads!",4000],["But none of that matters now.\nPrepare yourself.",2900]];
 let i=0;(function step(){if(tok!==introTok)return;if(i>=L.length){startBattle(true);return;}const t=L[i][0],ms=L[i][1];i++;say('Frank',t,null,Math.max(20,Math.min(60,Math.floor(ms*.75/t.length))));setTimeout(step,ms);})();}
function historyIntro(){say('Frank',"Hmm... I'm Frank Oliva. You might be a dirty polka player, but I guess I can teach you some history.",()=>say('Al',"Hey! Polka isn't dirty... but I do want to learn some history. What about the Chicago Riots?",()=>say('Frank',"Yeah, alright that's a pretty good topic, what do you wanna learn about it?",()=>chain('Frank',[HIST_INTRO],hub,22))));}
function nameQ(){choose('(What do you say?)',[['Tell him your real name',()=>say('Al',"I'm Al... WEIRD AL",historyIntro)],["I ain't tellin you my name",()=>say('Al',"I ain't tellin you my name.",()=>say('Frank',"Okay, then I'll just call you Yucky Hobo Man.",historyIntro))]]);}
function start(){asked=new Set();asked2=new Set();endless=false;$('stage').classList.remove('endless');$('score').style.display='none';$('blackout').classList.remove('on');const s=$('sprite');s.classList.remove('spin','big','bt','shake');s.style.display='';setSprite('normal');say('','You stroll down a road with your accordion.\nA figure blocks the way...',()=>say('Frank','Well, well, well. An accordion player.\nWhat is your name, stranger?',nameQ));}
function frankReturns(){const s=$('sprite');s.classList.remove('spin','big','shake','bt');s.style.display='';setSprite('normal');say('Frank','...As I lay here dying...\nCan I at least have your spicy chicken sandwich?',sandwichQ);}
function sandwichQ(){choose('(Give Frank your spicy chicken sandwich?)',[['Yes, give him the sandwich',()=>say('Al','Here. One spicy chicken sandwich.',()=>say('Frank','Mmm... SPICY. Thank you, stranger.\nNow I can die in peace...',()=>{$('sprite').style.display='none';say('','— THE END —  (click to return to the menu)',toMenu,60);}))],["No. It's mine.",()=>say('Al',"No. It's my sandwich.",()=>say('Frank','WRONG ANSWER.\nNow you polka... FOREVER!',()=>say('Al','*grips accordion*\n(Arrows/WASD to dodge. Tap/Space to strike, then heal with gabagool!)',startEndless))),true]]);}

// ---- MAIN MENU ----
const BEAT_KEY='frank_beat';
function hasBeaten(){let c=false,l=false;try{c=new RegExp('(?:^|; )'+BEAT_KEY+'=1').test(document.cookie);}catch(e){}try{l=localStorage.getItem(BEAT_KEY)==='1';}catch(e){}return c||l;}
function markBeaten(){try{document.cookie=BEAT_KEY+'=1; max-age=31536000; path=/; SameSite=Lax';}catch(e){}try{localStorage.setItem(BEAT_KEY,'1');}catch(e){}}
function showWarn(on){$('mm').style.display=on?'none':'flex';$('warn').style.display=on?'flex':'none';$('opt').style.display='none';}
function openMain(){showWarn(false);$('menu').style.display='flex';setMusic('menu');}
function closeMain(){showWarn(false);$('menu').style.display='none';setMusic(null);}
function toMenu(){clr();$('dlg').style.display='none';$('choices').innerHTML='';$('bm').innerHTML='';$('stage').classList.remove('endless');$('score').style.display='none';$('blackout').classList.remove('on');const s=$('sprite');s.classList.remove('spin','big','bt','shake');s.style.display='';endless=false;openMain();}
function mkSlider(label,key){
 const row=document.createElement('div');row.className='orow';
 const lab=document.createElement('div');lab.className='olab';
 const sl=document.createElement('div');sl.className='sl';
 const tr=new Image();tr.className='tr';tr.src='image/slider.avif';tr.draggable=false;tr.alt='';
 const kn=new Image();kn.className='kn';kn.src='image/rock.avif';kn.draggable=false;kn.alt='';
 sl.appendChild(tr);sl.appendChild(kn);row.appendChild(lab);row.appendChild(sl);
 const paint=()=>{kn.style.left=(VOL[key]*100)+'%';lab.textContent=label+'  '+Math.round(VOL[key]*100)+'%';};
 const setFrom=e=>{const r=sl.getBoundingClientRect();VOL[key]=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));paint();applyVol();saveVol();};
 let dragging=false;
 sl.addEventListener('pointerdown',e=>{dragging=true;try{sl.setPointerCapture(e.pointerId);}catch(_){}setFrom(e);});
 sl.addEventListener('pointermove',e=>{if(dragging)setFrom(e);});
 const end=e=>{if(!dragging)return;dragging=false;if(key==='speak')blip('a');};
 sl.addEventListener('pointerup',end);sl.addEventListener('pointercancel',()=>{dragging=false;});
 paint();$('sliders').appendChild(row);
}
mkSlider('MUSIC','music');mkSlider('SPEAKING','speak');
function showOpt(on){$('mm').style.display=on?'none':'flex';$('warn').style.display='none';$('opt').style.display=on?'flex':'none';}
$('optBtn').onclick=()=>showOpt(true);
$('optBack').onclick=()=>showOpt(false);
$('playBtn').onclick=()=>{closeMain();start();};
$('hdBtn').onclick=()=>{if(hasBeaten()){closeMain();startEndless();}else showWarn(true);};
$('warnOk').onclick=()=>{closeMain();start();};
$('warnNo').onclick=()=>{closeMain();startEndless();};

// ---- ENDLESS MODE ----
const HS_KEY='frank_hs';
function loadScore(){let c=0,l=0;try{const m=document.cookie.match(new RegExp('(?:^|; )'+HS_KEY+'=(\\d+)'));if(m)c=+m[1];}catch(e){}try{l=parseInt(localStorage.getItem(HS_KEY),10)||0;}catch(e){}return Math.max(c,l);}
function saveScore(){try{document.cookie=HS_KEY+'='+score+'; max-age=31536000; path=/; SameSite=Lax';}catch(e){}try{localStorage.setItem(HS_KEY,score);}catch(e){}}
function showScore(pop){const e=$('score');e.textContent='HIGH SCORE: '+score;e.style.display='block';e.classList.remove('pop');if(pop){void e.offsetWidth;e.classList.add('pop');}}
function startEndless(){setMusic('boss');endless=true;gab=5;score=loadScore();$('stage').classList.add('endless');showScore(false);startBattle();}
function blackout(){$('dlg').style.display='none';$('blackout').classList.add('on');
 setTimeout(()=>{const t="I'm not done yet...";say('Frank',t,null,70);setTimeout(revive,t.length*70+1400);},900);}
function revive(){const s=$('sprite');s.classList.remove('spin','big','shake');s.style.display='';$('blackout').classList.remove('on');showScore(true);startBattle();}

// ---- BOSS BATTLE ----
const cv=$('cv'),g=cv.getContext('2d'),W=360,AX=80,AY=50,AW=200,AH=150;
const TAUNTS=["Haha, Polka dies today!!!","Al? What a weirdo.","Polka was never good!!!","You call that polka?"];
const HD_TAUNTS=["GIMMIE THE SANDWICH YOU POLKA PLAYING HOOLIGAN","RAAAGGHHHH SPICY CHICKEN SANDWICH","NOW I CAN'T EAT LUNCH AND IM GONNA BLAME POLKA","I HATE ALL ACCORDIAN PLAYERS, KILL ALL ACCORDIAN PLAYERS"];
let curT=TAUNTS[0];
const BMAX=300,PMAX=100;let sc=1,gab=5,healed=0,run=false,st,tm,rnd_,php,bhp,inv,hx,hy,bl,sp,mk,dmg,last,tauntT=0,keys={},first=false;
const R=Math.random;
function startBattle(intro){clr();$('dlg').style.display='none';$('battle').style.display='block';$('sprite').classList.add('bt');setSprite('ref');php=PMAX;bhp=BMAX;if(!endless)gab=5;inv=0;resize();rnd_=0;tauntT=0;nextRound();first=intro===true;if(!run){run=true;last=performance.now();requestAnimationFrame(loop);}}
function resize(){const k=Math.max(1,cv.clientWidth/W*(window.devicePixelRatio||1));const w=Math.round(W*k);if(cv.width!==w){cv.width=w;cv.height=Math.round(215*k);}sc=cv.width/W;}
addEventListener('resize',()=>{if(run)resize();});
function mbtn(label,fn,img){const b=document.createElement('button');if(img){b.className='img';const i=new Image();i.src=BTN[img];b.appendChild(i);}else{b.className='txt';b.textContent=label;}b.onclick=e=>{e.stopPropagation();fn();};$('bm').appendChild(b);return b;}
function status(){return 'AL '+php+'/'+PMAX+' HP      GABAGOOL x'+gab;}
function hideMenu(){$('bm').innerHTML='';$('dlg').style.display='none';}
function showMenu(){st='menu';clr();$('bm').innerHTML='';$('txt').style.display='';$('dlg').style.display='block';$('name').style.display='none';$('more').style.display='none';cont=null;$('txt').textContent='';$('txt').style.display='none';mbtn('',goFight,'fight');mbtn('',goHeal,'heal');}
function goFight(){if(st!=='menu')return;hideMenu();st='bar';tm=0;}
function itemsUI(msg){st='items';$('bm').innerHTML='';$('txt').style.display='';$('txt').textContent=(msg?msg+'\n':'')+'Gabagool heals 30 HP.\n'+status();const b=mbtn('Eat gabagool  (x'+gab+')',eat);if(gab<=0||php>=PMAX)b.disabled=true;mbtn('Back',showMenu);}
function goHeal(){if(st!=='menu')return;itemsUI('');}
function eat(){if(st!=='items'||gab<=0||php>=PMAX)return;gab--;const o=php;php=Math.min(PMAX,php+30);itemsUI('+'+(php-o)+' HP!');}
function nextRound(){const pool=endless?TAUNTS.concat(HD_TAUNTS):TAUNTS;let t;do{t=pool[Math.floor(R()*pool.length)];}while(t===curT&&pool.length>1);curT=t;st='talk';tm=0;bl=[];sp=0;hx=AX+AW/2;hy=AY+AH/2;}
function endBattle(){run=false;$('bubble').style.display='none';$('battle').style.display='none';$('sprite').classList.remove('bt');setSprite('normal');}
function win(){endBattle();if(endless){score++;saveScore();death();}else{markBeaten();setMusic(null);say('Frank','There really were two hits. You hitting me, and me hitting the floor',death,40);}}
function death(){$('dlg').style.display='none';const s=$('sprite');setSprite('taunt');s.classList.add('spin');let bi;
 setTimeout(()=>{s.classList.remove('spin');s.classList.add('big');let n=0;s.src=BOOM+'?'+Date.now();bi=null;},1600);
 setTimeout(()=>{if(bi)clearInterval(bi);s.style.display='none';if(endless){blackout();return;}say('','KABOOM! Frank explodes into confetti.\nThe clouds part. Sunshine. You win, Al!',frankReturns,60);},2400);}
function lose(){endBattle();say('Frank','Ha! Is that all? Try again.',()=>say('Al','(One more time...)',startBattle));}
function strike(){if(st!=='bar')return;dmg=Math.round(12+38*(1-Math.abs(mk-.5)*2));bhp-=dmg;st='hit';tm=0;const s=$('sprite');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');}
function spawn(dt){const m=Math.min(1.8,1+.12*rnd_),p=rnd_%7;sp+=dt;
 if(p===0&&sp>250/m){sp=0;bl.push({x:AX+R()*AW,y:AY,vx:0,vy:(2+R())*m});}
 if(p===1&&sp>1000/m){sp=0;const gap=Math.floor(R()*6);for(let i=0;i<8;i++)if(i<gap||i>gap+2)bl.push({x:AX+12+i*25,y:AY,vx:0,vy:1.5*m});}
 if(p===2&&sp>650/m){sp=0;const x=R()<.5?AX:AX+AW,y=AY+R()*AH,a=Math.atan2(hy-y,hx-x);bl.push({x,y,vx:Math.cos(a)*1.8*m,vy:Math.sin(a)*1.8*m});}
 if(p===3&&sp>1100/m){sp=0;const gap=Math.floor(R()*4),L=R()<.5;for(let i=0;i<6;i++)if(i<gap||i>gap+2)bl.push({x:L?AX:AX+AW,y:AY+12+i*25,vx:(L?1:-1)*1.5*m,vy:0});}
 if(p===4&&sp>1200/m){sp=0;for(let i=0;i<7;i++){const a=Math.PI*(.2+.6*i/6);bl.push({x:AX+AW/2,y:AY,vx:Math.cos(a)*1.7*m,vy:Math.sin(a)*1.7*m});}}
 if(p===5&&sp>800/m){sp=0;bl.push({x:AX+R()*AW,y:AY,vx:(R()<.5?-1:1)*(1.4+R())*m,vy:1.6*m,bn:3});}
 if(p===6&&sp>450/m){sp=0;const e=Math.floor(R()*4),s=1.9*m;if(e===0)bl.push({x:AX+R()*AW,y:AY,vx:0,vy:s});else if(e===1)bl.push({x:AX+R()*AW,y:AY+AH,vx:0,vy:-s});else if(e===2)bl.push({x:AX,y:AY+R()*AH,vx:s,vy:0});else bl.push({x:AX+AW,y:AY+R()*AH,vx:-s,vy:0});}}
const bub=$('bubble');
function update(dt){tm+=dt;
 if(st==='talk'){const s=curT,n=Math.min(s.length,Math.floor(tm/TALK_MS));bub.style.display='block';if(bub.dataset.n!=n){bub.dataset.n=n;bub.textContent=s.slice(0,n);if(n>0)blip(s[n-1]);}}else bub.style.display='none';
 if(tauntT>0){tauntT-=dt;if(tauntT<=0)setSprite('ref');}
 if(st==='talk'&&tm>Math.max(first?4000:1800,curT.length*30+900)){st='dodge';tm=0;first=false;}
 else if(st==='dodge'){const v=2.6*dt/16;
  if(keys.arrowleft||keys.a)hx-=v;if(keys.arrowright||keys.d)hx+=v;if(keys.arrowup||keys.w)hy-=v;if(keys.arrowdown||keys.s)hy+=v;
  hx=Math.max(AX+6,Math.min(AX+AW-6,hx));hy=Math.max(AY+6,Math.min(AY+AH-6,hy));
  spawn(dt);inv-=dt;
  bl.forEach(b=>{b.x+=b.vx*dt/16;b.y+=b.vy*dt/16;if(b.bn!==undefined){if(b.x<AX+4||b.x>AX+AW-4){b.vx*=-1;b.x=Math.max(AX+4,Math.min(AX+AW-4,b.x));b.bn--;}if(b.y>AY+AH-4){b.vy*=-1;b.y=AY+AH-4;b.bn--;}if(b.bn<0)b.y=9999;}if(inv<=0&&(b.x-hx)**2+(b.y-hy)**2<HIT_R*HIT_R){php-=15;inv=900;b.y=9999;setSprite('taunt');tauntT=700;}});
  bl=bl.filter(b=>b.y>AY-25&&b.y<AY+AH+10&&b.x>AX-20&&b.x<AX+AW+20);
  if(php<=0)lose();else if(tm>7000){bl=[];showMenu();}}
 else if(st==='bar')mk=(Math.sin(tm/250-Math.PI/2)+1)/2;
 else if(st==='hit'&&tm>900){if(bhp<=0)win();else{rnd_++;nextRound();}}
 else if(st==='ate'&&tm>900){rnd_++;nextRound();}}
function txt(t,x,y,c,s){g.fillStyle=c||'#fff';g.font=(s||14)+'px "CustomFont","Trebuchet MS",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y);}
function box(x,y,w,h,c){g.strokeStyle=c;g.lineWidth=3;g.strokeRect(x,y,w,h);}
function draw(){g.setTransform(sc,0,0,sc,0,0);g.imageSmoothingEnabled=false;g.fillStyle='#000';g.fillRect(0,0,W,215);
 g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(80,10,200,10);g.fillStyle='#e33';g.fillRect(81,11,Math.max(0,198*bhp/BMAX),8);
 if(st!=='menu'&&st!=='items'){g.lineWidth=3;g.strokeRect(AX,AY,AW,AH);
 g.save();g.beginPath();g.rect(AX,AY,AW,AH);g.clip();bl.forEach(b=>g.drawImage(ROCK,Math.round(b.x-9),Math.round(b.y-10),18,20));g.restore();}
 if(st!=='bar'&&st!=='hit'&&st!=='menu'&&st!=='items'&&st!=='ate'&&!(st==='dodge'&&inv>0&&Math.floor(tm/80)%2)){g.drawImage(HEART,Math.round(hx-9),Math.round(hy-10),18,20);}
 if(st==='talk'&&first){txt('ARROWS / WASD',AX+AW/2,AY+24,'#ff0',11);txt('TO DODGE',AX+AW/2,AY+38,'#ff0',11);}
 if(st==='bar'){g.strokeStyle='#fff';g.strokeRect(AX+10,AY+AH/2-14,AW-20,28);g.fillStyle='#3c3';g.fillRect(AX+AW/2-15,AY+AH/2-12,30,24);g.fillStyle='#fff';g.fillRect(AX+10+mk*(AW-20)-2,AY+AH/2-18,4,36);txt('TAP / SPACE!',AX+AW/2,AY+20,'#ff0',13);}
 if(st==='hit')txt('-'+dmg,AX+AW/2,AY+AH/2,'#f55',30);
 if(st==='ate')txt('+'+healed+' HP',AX+AW/2,AY+AH/2,'#5f5',30);
 g.fillStyle='#600';g.fillRect(96,28,120,10);g.fillStyle='#ff0';g.fillRect(96,28,120*Math.max(0,php)/PMAX,10);txt('AL '+Math.max(0,php)+'/'+PMAX,262,33,'#fff',12);txt('GABAGOOL x'+gab,46,33,'#fff',11);}
function loop(now){if(!run)return;const dt=Math.min(50,now-last);last=now;update(dt);draw();requestAnimationFrame(loop);}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '){e.preventDefault();strike();}if(st==='menu'){if(k==='f'||k==='1')goFight();if(k==='h'||k==='2')goHeal();}else if(st==='items'){if(k==='g'||k==='1')eat();if(k==='b'||k==='escape')showMenu();}keys[k]=1;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
cv.addEventListener('pointerdown',e=>{if(st==='bar')strike();});
// ---- DEBUG: press F three times fast -> fight Frank at 1 HP ----
let fT=[];
function debugFight(){introTok++;clr();closeMain();setMusic('boss');$('blackout').classList.remove('on');$('choices').innerHTML='';const s=$('sprite');s.classList.remove('spin','big','shake');s.style.display='';startBattle();bhp=1;gab=5;}
addEventListener('keydown',e=>{if(e.key.toLowerCase()!=='f'||e.repeat)return;const n=performance.now();fT=fT.filter(t=>n-t<900);fT.push(n);if(fT.length>=3){fT=[];debugFight();}});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
openMain();
</script>
</body>
