<!DOCTYPE html>
<html lang="en">
<head>

<style>
@font-face{font-family:"CustomFont";src:url(font/terminal-font.ttf) format("truetype");font-display:swap}
:root{--fg:#fff;--bg:#000;--accent:#f33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);font-family:"CustomFont","Trebuchet MS",sans-serif;color:var(--fg)}
#stage{position:relative;height:100%;max-width:820px;margin:0 auto;overflow:hidden;background:var(--bg);user-select:none;touch-action:none}
#sprite{position:absolute;left:50%;bottom:160px;transform:translateX(-50%);height:min(50vh,420px);image-rendering:pixelated}
#sprite.bt{bottom:40%}
#sprite.shake{animation:sh .3s}

@keyframes rg{0%{transform:translateX(-50%) translate(-5px,2px) rotate(-2deg)}25%{transform:translateX(-50%) translate(4px,-3px) rotate(2deg)}50%{transform:translateX(-50%) translate(-3px,-2px) rotate(-1deg)}75%{transform:translateX(-50%) translate(5px,3px) rotate(2deg)}100%{transform:translateX(-50%) translate(-5px,2px) rotate(-2deg)}}
#angry{display:none;position:absolute;z-index:2;--sh:min(50vh,420px);width:calc(var(--sh)*.2);height:auto;left:calc(50% + var(--sh)*.07);bottom:calc(160px + var(--sh)*.8);image-rendering:pixelated;pointer-events:none;animation:vein .25s ease-in-out infinite}

#bubble{display:none;position:absolute;z-index:4;top:8px;left:50%;transform:translateX(-50%);max-width:88%;box-sizing:border-box;background:var(--bg);border:12px solid transparent;border-image:url(image/text_box.avif) 6 stretch;image-rendering:pixelated;padding:2px 8px;font-family:"CustomFont","Courier New",monospace;font-size:.95rem;text-align:center;line-height:1.3}

#bm{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}

#bm button.txt{font:inherit;font-size:1rem;padding:8px 10px;border:18px solid transparent;border-image:url(image/choice_box.avif) 6 stretch;image-rendering:pixelated;background:var(--bg);color:var(--fg);cursor:pointer}
#bm button.txt:hover{background:#222}

#dlg:has(#bm button.img){padding:6px}

#cv{width:min(100%,66vh);height:auto;touch-action:none}

@keyframes pop{40%{transform:scale(1.35);color:#fff}}
#stage.endless #bubble{top:58px}
#blackout{position:absolute;z-index:4;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#blackout.on{opacity:1;pointer-events:auto}
#menu{position:absolute;z-index:6;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:min(16vh,120px) 16px 0;box-sizing:border-box;background:#000;image-rendering:pixelated}
#menu h1{margin:0 0 min(9vh,64px);font:inherit;font-size:clamp(2.4rem,11vw,4rem);font-weight:normal;line-height:1.1;text-align:center;padding:6px 32px;border:18px solid transparent;border-image:url(image/text_box.avif) 6 stretch;background:var(--bg)}

#warn button{max-width:100%}
#menu button.evil{border-image-source:url(image/choice_box2.avif);color:var(--accent)}


.orow{width:100%;margin-bottom:min(5vh,30px);text-align:center}
.olab{font-size:1.1rem;margin-bottom:12px}
.sl{position:relative;width:min(160px,36vw);margin:0 auto;cursor:pointer;touch-action:none;user-select:none}
.sl img.tr{display:block;width:100%;height:auto;image-rendering:pixelated;pointer-events:none}
.sl img.kn{position:absolute;top:50%;width:17px;height:auto;image-rendering:pixelated;transform:translate(-50%,-50%);pointer-events:none}
#mg{display:none;flex-direction:column;align-items:center;width:min(480px,100%)}#mg h2{margin:0 0 min(5vh,32px);font:inherit;font-size:clamp(1.6rem,7vw,2.2rem);font-weight:normal}#mg button{max-width:100%}
#opt{display:none;flex-direction:column;align-items:center;width:min(420px,100%)}#opt h2{margin:0 0 min(5vh,32px);font:inherit;font-size:clamp(1.6rem,7vw,2.2rem);font-weight:normal}#opt button{max-width:100%}
#mgWrap{display:none;position:fixed;z-index:20;top:0;left:0;right:0;bottom:0;background:#000}#mgFrame{width:100%;height:100%;border:0;display:block}#mgX{position:absolute;z-index:21;top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));padding:8px;background:none;border:none;opacity:.8;cursor:pointer;line-height:0}#mgX img{width:40px;height:40px;image-rendering:pixelated;display:block;filter:drop-shadow(3px 3px 0 #000)}#mgX:hover{opacity:1}
#load{font-size:.9rem;min-height:1.2em;color:#aaa}
#menu button:disabled{opacity:.4;cursor:default}
#ver{position:fixed;z-index:9;left:calc(6px + env(safe-area-inset-left,0px));bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:.75rem;color:#fff;opacity:.5;pointer-events:none;font-family:"CustomFont","Courier New",monospace}
#credits{padding:10px;margin:-10px;cursor:default;position:fixed;z-index:9;right:calc(6px + env(safe-area-inset-right,0px));bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:.75rem;color:#fff;opacity:.5;pointer-events:none;font-family:"CustomFont","Courier New",monospace}
#nm{display:none;flex-direction:column;align-items:center;max-width:100%}#nm h2{margin:0 0 min(3vh,20px);font:inherit;font-size:clamp(1.6rem,7vw,2.2rem);font-weight:normal}#nm p{margin:0 0 20px;box-sizing:border-box;max-width:min(520px,100%);text-align:center;font-size:1.15rem;line-height:1.4;padding:10px 14px;border:18px solid transparent;border-image:url(image/text_box.avif) 6 stretch;background:var(--bg)}#nm input{font:inherit;font-size:1.3rem;text-align:center;width:min(300px,80%);margin-bottom:14px;padding:4px 10px;border:12px solid transparent;border-image:url(image/choice_box.avif) 6 stretch;image-rendering:pixelated;background:var(--bg);color:var(--fg);outline:none;box-sizing:border-box}
#lb{display:none;flex-direction:column;align-items:center;width:min(480px,100%)}#lb h2{margin:0 0 min(3vh,20px);font:inherit;font-size:clamp(1.6rem,7vw,2.2rem);font-weight:normal}#lbTabs{display:flex;justify-content:center;flex-wrap:wrap}#menu #lbTabs button{font-size:.95rem;padding:0 8px;margin:0 3px 10px;border-width:8px}#menu #lbTabs button.on{background:#333}#lbList{width:100%;box-sizing:border-box;min-height:80px;margin-bottom:14px;padding:6px 10px;border:18px solid transparent;border-image:url(image/text_box.avif) 6 stretch;background:var(--bg);font-size:1.05rem}.lbr{display:flex;gap:10px;padding:2px 0}.lbr .rk{width:2.2em;opacity:.6}.lbr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr.me{color:var(--accent)}.lbmsg{text-align:center;opacity:.7;padding:8px 0}#lb button{max-width:100%}#lbRows{max-height:min(26vh,220px);overflow:auto}#lbPin{display:none;margin-top:6px;padding-top:6px;border-top:2px dashed #666}#lbPager{display:none;align-items:center;justify-content:center;gap:12px;margin:-4px 0 10px;font-size:1rem}#menu #lbPager button{font-size:.95rem;padding:0 10px;margin:0;border-width:8px}#hdX{display:none;position:fixed;z-index:15;top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));padding:8px;background:none;border:none;opacity:.8;cursor:pointer;line-height:0}#hdX img{width:40px;height:40px;image-rendering:pixelated;display:block;filter:drop-shadow(3px 3px 0 #000)}#hdX:hover{opacity:1}#pauseBtn{position:fixed;z-index:14;top:calc(6px + env(safe-area-inset-top,0px));left:calc(6px + env(safe-area-inset-left,0px));padding:8px;background:none;border:none;opacity:.8;cursor:pointer;line-height:0}#pauseBtn img{width:40px;height:40px;image-rendering:pixelated;display:block;filter:drop-shadow(3px 3px 0 #000)}#pauseBtn:hover{opacity:1}body.mm #pauseBtn{display:none}#pz{display:none;position:fixed;z-index:30;top:0;left:0;right:0;bottom:0;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(0,0,0,.72);image-rendering:pixelated}#pzBox{display:flex;flex-direction:column;align-items:center;width:min(420px,100%);box-sizing:border-box;padding:12px 18px 0;border:18px solid transparent;border-image:url(image/text_box.avif) 6 stretch;background:var(--bg)}#pz h2{margin:0 0 min(4vh,24px);font:inherit;font-size:clamp(1.6rem,7vw,2.2rem);font-weight:normal;text-align:center}body.paused #stage *{animation-play-state:paused!important}#nmErr{min-height:1.3em;max-width:min(520px,100%);margin:-4px 0 12px;text-align:center;font-size:.95rem;color:var(--accent)}#lbBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.lbtag{opacity:.45;font-size:.8em;margin-left:4px}#lbYou{width:100%;text-align:center;margin-bottom:10px;font-size:.95rem;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<body>
<div id="stage">
<img id="sprite" alt="Frank" src="">
<img id="angry" alt="" src="image/angry.avif" draggable="false">
<div id="bubble"></div>

<div id="dlg"><div id="name"></div><p id="txt"></p><div id="bm"></div><span id="more">▼</span></div>

<div id="score"></div>
<div id="blackout"></div>
<div id="menu"><div id="mm"><h1>Olivarune</h1><button id="playBtn">PLAY</button><button id="hdBtn">INFINITE HYPERDEATH</button><button id="trueBtn" style="display:none">true ending...</button><button id="mgBtn">MINIGAMES</button><button id="optBtn">OPTIONS</button><div id="load"></div></div><div id="opt"><h2>OPTIONS</h2><div id="sliders2"></div><button id="optBack">BACK</button></div><div id="mg"><h2>MINIGAMES</h2><button id="mgRiots">INITIATE THE CHICAGO RIOTS</button><button id="mgBack">BACK</button></div><div id="lb"><h2>INFINITE HYPERDEATH</h2><button id="lbPlay">PLAY</button><div id="lbTabs"><button id="lbD" class="on">DAILY</button><button id="lbW">WEEKLY</button><button id="lbL">LIFETIME</button></div><div id="lbList"><div id="lbRows"></div><div id="lbPin"></div></div><div id="lbPager"><button id="lbPrev">&lt;</button><span id="lbPg"></span><button id="lbNext">&gt;</button></div><div id="lbYou"></div><div id="lbBtns"><button id="lbRename">RENAME</button><button id="lbBack">BACK</button></div></div><div id="warn"><p>hey! you might wanna play the story before playing INFINITE HYPERDEATH</p><button id="warnOk">okay</button><button id="warnNo" class="evil">no I'm a yucky hobo and hate fun</button></div><div id="nm"><h2>LEADERBOARD</h2><p>enter your name to be added to the leaderboard</p><input id="nmIn" maxlength="16" autocomplete="off" spellcheck="false"><div id="nmErr"></div><button id="nmOk">SUBMIT</button><button id="nmBack" style="display:none">CANCEL</button></div></div>
</div>
<button id="pauseBtn" aria-label="Pause"><img src="image/pause.avif" alt="" draggable="false"></button><div id="pz"><div id="pzBox"><h2>PAUSED</h2><div id="sliders"></div><button id="pzBack">RESUME</button></div></div><button id="hdX" aria-label="Exit"><img src="image/x.avif" alt="" draggable="false"></button><div id="mgWrap"><iframe id="mgFrame" title="minigame" allow="autoplay; fullscreen" allowfullscreen></iframe><button id="mgX" aria-label="Exit"><img src="image/x.avif" alt="" draggable="false"></button></div>
<script>
// ---- pause-aware timers: everything the game schedules freezes while the pause menu is open ----
let gPaused=false,gPauseAt=0,gLost=0,gSeq=0;const gTim=new Map();
const gnow=()=>(gPaused?gPauseAt:performance.now())-gLost; // game clock: doesn't advance while paused
function gArm(id){const t=gTim.get(id);if(!t)return;t.start=performance.now();t.h=setTimeout(()=>{const c=gTim.get(id);if(!c)return;if(c.per){c.rem=c.per;gArm(id);}else gTim.delete(id);c.fn();},t.rem);}
function gSetTimeout(fn,ms){const id=++gSeq;gTim.set(id,{fn,rem:+ms||0,per:0,start:0,h:0});gArm(id);return id;}
function gSetInterval(fn,ms){const id=++gSeq;ms=Math.max(1,+ms||1);gTim.set(id,{fn,rem:ms,per:ms,start:0,h:0});gArm(id);return id;}
function gClearTimeout(id){const t=gTim.get(id);if(t){clearTimeout(t.h);gTim.delete(id);}}
const gClearInterval=gClearTimeout;
function gPause(){if(gPaused)return;gPaused=true;gPauseAt=performance.now();gTim.forEach(t=>{clearTimeout(t.h);t.rem=Math.max(0,t.rem-(gPauseAt-t.start));});}
function gResume(){if(!gPaused)return;gLost+=performance.now()-gPauseAt;gPaused=false;gTim.forEach((t,id)=>gArm(id));}
const IMG={normal:'image/frank_normal.avif',talk1:'image/frank_talk1.avif',talk2:'image/frank_talk2.avif',taunt:'image/frank_taunt.avif',ref:'image/frank_sans.avif'};
const $=id=>document.getElementById(id);
const BOOM='gif/explode.gif';
let HEART,ROCK;
const BTN={fight:'image/fight.avif',heal:'image/heal.avif'};
const VOL_KEY='frank_vol';const VOL={music:1,speak:1};
try{const v=JSON.parse(localStorage.getItem(VOL_KEY)||'{}');if(typeof v.music==='number')VOL.music=Math.max(0,Math.min(1,v.music));if(typeof v.speak==='number')VOL.speak=Math.max(0,Math.min(1,v.speak));}catch(e){}
function saveVol(){try{localStorage.setItem(VOL_KEY,JSON.stringify(VOL));}catch(e){}}
const TALK_MS=30,HIT_R=11;
const KEEP=[];let preLeft=0,preTotal=0;
function preUI(){const e=$('load');if(e)e.textContent=preLeft>0?'loading '+(preTotal-preLeft)+'/'+preTotal+'...':'';$('playBtn').disabled=$('lbPlay').disabled=$('trueBtn').disabled=preLeft>0;}
function track(p){preTotal++;preLeft++;let d=0;const done=()=>{if(d)return;d=1;preLeft--;preUI();};p.then(done,done);gSetTimeout(done,8000);}
function pimg(src){const i=new Image();KEEP.push(i);track(new Promise(r=>{i.onload=r;i.onerror=r;}));i.src=src;return i;}
track(document.fonts.load('16px CustomFont'));
HEART=pimg('image/heart.avif');ROCK=pimg('image/rock.avif');
[...Object.values(IMG),...Object.values(BTN),'image/text_box.avif','image/choice_box.avif','image/choice_box2.avif','image/slider.avif','image/angry.avif',BOOM].forEach(u=>pimg(u));
preUI();
const POOL=[];let pi=0,unlocked=false;
for(let k=0;k<4;k++){const a=new Audio('audio/talk.aac');a.preload='auto';POOL.push(a);}
function unlock(){unlocked=true;}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function blip(ch,w){if(!unlocked||!ch||/\s/.test(ch)||VOL.speak<=0)return;const P=dev&&w===DEV_NAME&&DP.length?DP:POOL,a=P[pi++%P.length];try{a.volume=.5*VOL.speak;a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
// ---- MUSIC ----
const mkTrack=(srcs,loop)=>{const a=new Audio();a.preload='auto';a.loop=loop;a.volume=.5;srcs.forEach(u=>{const e=document.createElement('source');e.src=u;a.appendChild(e);});return a;};
const MUS={menu:mkTrack(['audio/anza.aac'],true),boss:mkTrack(['audio/BIG_SHOT.aac','audio/BIGSHOT.aac'],false),loop:mkTrack(['audio/BIG_SHOT_loop.aac','audio/BIGSHOT_loop.aac'],true),dev:mkTrack(['DEV_boss/audio/EventH.aac'],true)};MUS.dev.preload='none';
// Menu music plays through Web Audio (not an <audio> element) so Windows/OS media controls don't pick it up.
const AC=window.AudioContext||window.webkitAudioContext;
let mCtx=null,mBuf=null,mSrc=null,mGain=null,mFail=!AC,mLoading=false;
function mLoad(){if(mBuf||mFail||mLoading)return;mLoading=true;
 fetch('audio/anza.aac').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(b=>{mCtx=mCtx||new AC();return new Promise((ok,no)=>mCtx.decodeAudioData(b,ok,no));}).then(b=>{mBuf=b;mLoading=false;applyMusic();}).catch(()=>{mFail=true;mLoading=false;applyMusic();});}
function mPlay(){if(!mCtx)mCtx=new AC();if(mCtx.state!=='running')mCtx.resume().catch(()=>{});if(mSrc)return;
 if(!mGain){mGain=mCtx.createGain();mGain.connect(mCtx.destination);}mGain.gain.value=.5*VOL.music;
 const s=mCtx.createBufferSource();s.buffer=mBuf;s.loop=true;s.connect(mGain);s.start(0);mSrc=s;}
function mStop(){if(mSrc){try{mSrc.stop();}catch(e){}try{mSrc.disconnect();}catch(e){}mSrc=null;}}
function applyVol(){for(const k in MUS)MUS[k].volume=.5*VOL.music;if(mGain)mGain.gain.value=.5*VOL.music;}applyVol();
let wantMus='menu',bossDone=false;
function applyMusic(){const act=wantMus==='menu'?'menu':wantMus==='boss'?(bossDone?'loop':'boss'):wantMus==='dev'?'dev':null;
 const wa=!mFail;if(act==='menu'&&wa){if(mBuf)mPlay();else mLoad();}else mStop();
 for(const k in MUS){const a=MUS[k];if(k==='menu'&&wa)continue;if(k===act){if(a.paused)a.play().catch(()=>{});}else if(!a.paused||a.currentTime>0){a.pause();a.currentTime=0;}}}
function setMusic(k){if(k==='boss'&&wantMus!=='boss')bossDone=false;wantMus=k;applyMusic();}
function bossToLoop(){if(wantMus==='boss'&&!bossDone){bossDone=true;applyMusic();}}
MUS.boss.addEventListener('ended',bossToLoop);
gSetInterval(()=>{const a=MUS.boss;if(wantMus==='boss'&&!bossDone&&!a.paused&&isFinite(a.duration)&&a.duration>0&&a.currentTime>=a.duration-.06)bossToLoop();},25);
['pointerdown','pointerup','keydown','touchend','click'].forEach(ev=>addEventListener(ev,e=>{if(e.target&&e.target.closest&&e.target.closest('#menu button'))return;applyMusic();},{passive:true}));
const SEQ=['normal','talk1','talk2','talk1'];
let cont=null,asked,asked2,typing=false,fin=null,ty=null,tk=null,endless=false,score=0,introTok=0;
function setSprite(k){if(IMG[k])$('sprite').src=IMG[k];}
let exTok=0;let rageT=0;function rage(ms){const s=$('sprite');gClearTimeout(rageT);s.classList.add('rage');$('angry').style.display='block';rageT=ms?gSetTimeout(calm,ms):0;}
function calm(){gClearTimeout(rageT);$('sprite').classList.remove('rage');$('angry').style.display='none';}

const HIST_INTRO=`In late July 1919, Chicago broke into one of the worst episodes of racial violence in American history. The riot began on July 27 and continued in waves until early August, leaving 38 people dead, of which 23 were black and 15 were white, 537 injured, and roughly a thousand, mostly Black, residents homeless. It was the deadliest outbreak of the "Red Summer" of 1919, when violence against black people flared in dozens of cities. The immediate spark was small, but the conditions that made it so terrible were building for a long time before that.`;
const HIST_Q=[
["What led to the Chicago Riots?",[
`Well the direct trigger was the death of Eugene Williams, a 17-year-old Black teenager whose raft drifted across the "line" that divided the 29th Street beach. A white man on the shore threw rocks at him, preventing him from coming to shore and causing Williams to drown. When a white police officer refused to arrest the man responsible and instead chose to arrest a black man who had thrown a punch at the killer, which turned the crowd's anger into violence.`,
`There was also the Great Migration that brought tens of thousands of Black Southerners to Chicago in search of industrial work and an escape from the Jim Crow laws, and the city's Black population roughly doubled between 1910 and 1920. This growth collided with a rigid housing market. Restrictive covenants, real estate practices, and social pressure confined Black residents to the narrow, overcrowded "Black Belt" on the South Side. As Black families pushed outward in search of decent housing, white neighbors and "improvement associations" resisted, and dozens of Black homes were firebombed in the years before the riot.`,
`Labor competition also added to the tension. Many Black workers had been hired into the stockyards and packing plants during World War I, sometimes as strikebreakers, and most white-dominated unions excluded them or treated them with hostility. When soldiers returned home in 1919 and the wartime economy shrank, white workers feared for their jobs, while Black workers, including veterans who had fought for democracy abroad, were less willing to accept second-class treatment. Institutions only made matters worse. The police were widely seen as biased, and the press often dramatized racial incidents. White neighborhood athletic clubs, which functioned partly as street gangs, organized attacks on Black residents, while politics fueled ethnic and racial rivalries.`]],
["What happened after the Riots?",[
`The immediate effects were seen in lives and property. Six thousand state militia troops eventually helped restore order, and a heavy rainfall also helped end the violence. Black residents bore the heaviest losses, including most of the homes destroyed. Criminal prosecutions afterward were uneven, and few white rioters faced serious consequences.`]],
["What did the gov change after the fact?",[
`Governor Frank Lowden appointed the Chicago Commission on Race Relations, which produced the 1922 report The Negro in Chicago. It was a landmark study that documented housing discrimination, employment barriers, and police bias, and it recommended reforms. Yet its recommendations were largely ignored. Restrictive covenants spread, and residential segregation hardened over the following decades, leaving the Black Belt more tightly bound than before. The riots also reshaped Black political and cultural life. Anti-lynching and civil rights organizing gained momentum, and a stronger belief of self-defense took hold, captured in works like Claude McKay's poem "If We Must Die." Within Chicago, Black political organization deepened, eventually contributing to the rise of figures such as Oscar De Priest, who in 1928 became the first Black congressman elected from the North. Distrust between Black workers and organized labor persisted, and many Black workers concluded that employers were a more reliable, if self-interested, ally than white-led unions.`]]];
const HIST_SUM=`So you see, AL. The 1919 riots were not a spontaneous outburst but the product of migration, housing segregation, labor competition, and institutional bias reaching a breaking point. Its effects were just as lasting, the failure to act on its lessons entrenched segregation in Chicago, while the anger and organizing it inspired helped lay groundwork for the civil rights movement.`;
